name: Build Project

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build, Test, and Analyze with SonarCloud (Tahap CI)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      run: |
        mvn verify sonar:sonar \
        -Dsonar.host.url=https://sonarcloud.io \
        -Dsonar.organization=aditya-0122 \
        -Dsonar.projectKey=aditya-0122_MKEPL_Week12_CICD

    - name: Upload Artifact (Tahap Simulasi CD/Deployment)
      uses: actions/upload-artifact@v4
      with:
        name: rilis-aplikasi-java
        path: target/*.jar
